server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # SPA fallback — route all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated — it points to the hashed asset
    # filenames, so a stale copy keeps users on an old deploy.
    # NOTE: nginx does not merge add_header across levels — a block that
    # declares any add_header drops every one inherited from `server`,
    # so the security headers are repeated here on purpose.
    location = /index.html {
        add_header Cache-Control "no-cache" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cache static assets aggressively — safe because Vite content-hashes
    # every filename, so changed content always means a new URL.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        # Repeated for the same inheritance reason as above.
        add_header X-Content-Type-Options "nosniff" always;

        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
